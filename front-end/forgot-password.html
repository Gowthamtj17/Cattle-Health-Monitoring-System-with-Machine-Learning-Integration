<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Forgot Password</title>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,ta,ml,kn,te,hi',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false 
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  
    
</head>
<body>
   
    <div class="container">
        <h2 class="title"><img src=".\images\reset-password.png" alt="Logo" class="logo">Forgot Password</h2>
        <form id="forgotPasswordForm">
            <input type="email" id="forgotEmail" placeholder="Email" required>
            <button class="bt" type="submit">Reset</button>
            <p>Back to Login <a href="index.html">Click Here</a></p>
        </form>
    </div>
    <!-- Google Translate widget -->
    <div id="google_translate_element"></div>
    <script type="module" src="script.js"></script>
</body>
</html>
